[workspace]
resolver = "2"
members = ["crates/zerolm-policy", "crates/zerolm-tensor", "crates/zerolm-nn", "crates/zerolm-tokenizer", "crates/zerolm-engine", "crates/zerolm-eval", "crates/zerolm-runtime", "crates/zerolm-learning", "crates/zerolm-memory"]

[workspace.package]
version = "0.3.0-dev"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.test]
opt-level = 2
