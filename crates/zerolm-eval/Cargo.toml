[package]
name = "zerolm-eval"
description = "Architecture bake-off, online-learning, memory, and reasoning benchmarks; the reference ISA interpreter"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zerolm-tensor = { path = "../zerolm-tensor" }
zerolm-nn = { path = "../zerolm-nn" }
zerolm-engine = { path = "../zerolm-engine" }
zerolm-learning = { path = "../zerolm-learning" }
zerolm-policy = { path = "../zerolm-policy" }
zerolm-memory = { path = "../zerolm-memory" }
zerolm-reasoner = { path = "../zerolm-reasoner" }
serde.workspace = true
serde_json.workspace = true

[[bin]]
name = "zerolm-bakeoff"
path = "src/bin/bakeoff.rs"

[[bin]]
name = "zerolm-online-lm"
path = "src/bin/online_lm.rs"

[[bin]]
name = "zerolm-memory"
path = "src/bin/memory_bench.rs"

[[bin]]
name = "zerolm-reasoning"
path = "src/bin/reasoning_bench.rs"
