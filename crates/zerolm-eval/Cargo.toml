[package]
name = "zerolm-eval"
description = "Architecture bake-off, online-learning, memory, and reasoning benchmarks; the reference ISA interpreter"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zerolm-tensor = { path = "../zerolm-tensor" }
zerolm-nn = { path = "../zerolm-nn" }
zerolm-engine = { path = "../zerolm-engine" }
zerolm-learning = { path = "../zerolm-learning" }
zerolm-policy = { path = "../zerolm-policy" }
zerolm-memory = { path = "../zerolm-memory" }
zerolm-reasoner = { path = "../zerolm-reasoner" }
zerolm-wsp = { path = "../zerolm-wsp" }
zerolm-data = { path = "../zerolm-data" }
serde.workspace = true
serde_json.workspace = true

[[bin]]
name = "zerolm-bakeoff"
path = "src/bin/bakeoff.rs"

[[bin]]
name = "zerolm-online-lm"
path = "src/bin/online_lm.rs"

[[bin]]
name = "zerolm-memory"
path = "src/bin/memory_bench.rs"

[[bin]]
name = "zerolm-reasoning"
path = "src/bin/reasoning_bench.rs"

[[bin]]
name = "zerolm-uniform"
path = "src/bin/uniform.rs"

[[bin]]
name = "zerolm-realtext"
path = "src/bin/realtext.rs"

[[bin]]
name = "zerolm-benchmarks"
path = "src/bin/benchmarks.rs"

[[bin]]
name = "zerolm-representation"
path = "src/bin/representation.rs"

[[bin]]
name = "zerolm-gradient-gate"
path = "src/bin/gradient_gate.rs"

[[bin]]
name = "zerolm-curves"
path = "src/bin/curves.rs"

[[bin]]
name = "zerolm-headroom"
path = "src/bin/headroom.rs"

[[bin]]
name = "zerolm-hybrid"
path = "src/bin/hybrid.rs"

[[bin]]
name = "zerolm-circuit"
path = "src/bin/circuit.rs"

[[bin]]
name = "zerolm-gdm"
path = "src/bin/gdm.rs"
