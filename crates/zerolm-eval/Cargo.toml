[package]
name = "zerolm-eval"
description = "Phase 2 architecture bake-off, Phase 4 online-learning benchmark, and Phase 5 memory benchmark"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zerolm-tensor = { path = "../zerolm-tensor" }
zerolm-nn = { path = "../zerolm-nn" }
zerolm-engine = { path = "../zerolm-engine" }
zerolm-learning = { path = "../zerolm-learning" }
zerolm-policy = { path = "../zerolm-policy" }
zerolm-memory = { path = "../zerolm-memory" }
serde.workspace = true
serde_json.workspace = true

[[bin]]
name = "zerolm-bakeoff"
path = "src/bin/bakeoff.rs"

[[bin]]
name = "zerolm-online-lm"
path = "src/bin/online_lm.rs"

[[bin]]
name = "zerolm-memory"
path = "src/bin/memory_bench.rs"
