name: docker
# Builds the ZeroLM image, smoke-tests it, and publishes it to the GitHub
# Container Registry as ghcr.io/<owner>/zerolm. Pull requests build and test
# only; pushes to main publish :latest and :sha-<short>; tags v* publish
# the version tag as well.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name (registry names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zerolm" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: zerolm:ci
          build-args: ZEROLM_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          mkdir -p reports/docker
          {
            docker run --rm zerolm:ci zerolm info
            docker run --rm -i zerolm:ci zerolm reason --verbose < examples/reasoning-more.txt
            docker run --rm zerolm:ci zerolm-audit --json
          } 2>&1 | tee reports/docker/smoke.txt
          grep -q "no (derived: attribute_inheritance, negation" reports/docker/smoke.txt
          grep -q '"violations": \[\]' reports/docker/smoke.txt
      - name: Image tests
        run: docker run --rm zerolm:ci cargo test --workspace --locked
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Docker image"
            echo "- image: \`${IMAGE}\`"
            echo "- tags: \`$(echo '${{ steps.meta.outputs.tags }}' | tr '\n' ' ')\`"
            echo "- published: ${{ github.event_name != 'pull_request' }}"
            if [ -s reports/docker/smoke.txt ]; then echo '```'; head -60 reports/docker/smoke.txt; echo '```'; else echo "Smoke test: **not produced**"; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: ZEROLM_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
