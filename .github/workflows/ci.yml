name: ZeroLM CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zerolm-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, test and examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Capture runner and toolchain information
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          {
            echo "Runner OS: ${RUNNER_OS}"
            echo "Runner architecture: $(uname -m)"
            echo "Compiler:"
            cc --version | head -n 2
            echo
            echo "Make:"
            make --version | head -n 1
            echo
            echo "Python:"
            python3 --version
            echo
            echo "Git commit: ${GITHUB_SHA}"
          } | tee reports/environment.txt

      - name: Validate source specification and generated weights
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool model/spec.json > /dev/null
          python3 -m compileall -q build_model.py scripts
          sh -n run.sh
          make check-generated

      - name: Build and run the complete project pipeline
        id: pipeline
        shell: bash
        run: |
          set -euo pipefail
          make pipeline 2>&1 | tee reports/pipeline.log

      - name: Run documented CLI examples
        id: examples
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run_examples.py --report reports/examples.json 2>&1 | tee reports/examples.log

      - name: Save machine-readable weight audit
        id: weight_audit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/weight_audit.py --json > reports/weight-audit.json
          cat reports/weight-audit.json

      - name: Save machine-readable benchmark
        id: benchmark
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/benchmark.py --iterations 500 --json > reports/benchmark.json
          cat reports/benchmark.json

      - name: Run online CLINC150 benchmark
        id: online_benchmark
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/online_benchmark.py --limit 400 --min-abstain 0.85 --min-accuracy 0.15 2>&1 | tee reports/online-benchmark.log
          python3 scripts/online_benchmark.py --limit 400 --json > reports/online-benchmark.json || true

      - name: Smoke test with a 2 GiB virtual-memory limit (Linux)
        id: memory_guard
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          (ulimit -Sv 2097152; ./zerolm --self-test) 2>&1 | tee reports/memory-limit-smoke.log

      - name: Mark memory check as not applicable (non-Linux)
        if: runner.os != 'Linux'
        shell: bash
        run: echo "Skipped - ulimit -Sv check is Linux-specific in this workflow." > reports/memory-limit-smoke.log

      - name: Write GitHub Actions job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PIPELINE_OUTCOME: ${{ steps.pipeline.outcome }}
          EXAMPLES_OUTCOME: ${{ steps.examples.outcome }}
          MEMORY_OUTCOME: ${{ steps.memory_guard.outcome }}
        shell: bash
        run: python3 scripts/ci_summary.py

      - name: Upload test evidence and reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: zerolm-ci-reports-${{ runner.os }}
          path: |
            reports/
            zerolm
            zerolm.exe
          if-no-files-found: warn
          retention-days: 14

  rust:
    name: Rust port parity (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Unit and end-to-end tests
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Lint (clippy, warnings are errors)
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - name: Build C reference and Rust release binary
        run: |
          make all
          cargo build --release --manifest-path rust/Cargo.toml

      - name: Output parity with C reference
        shell: bash
        run: |
          set -euo pipefail
          R=rust/target/release/zerolm
          diff <(./zerolm --self-test) <($R --self-test)
          diff <(./zerolm --info) <($R --info)
          while IFS=$'\t' read -r a b; do
            case "$a" in ''|\#*) continue;; esac
            p="${b:-$a}"
            diff <(./zerolm --verbose "$p") <($R --verbose "$p") >/dev/null || { echo "DIFF: $p"; exit 1; }
            diff <(./zerolm --verbose "$p") <($R --verbose --faithful "$p") >/dev/null || { echo "FAITHFUL DIFF: $p"; exit 1; }
          done < <(cat tests/regression.tsv tests/unknown.tsv examples/prompts.tsv)

      - name: Parity on typo-damaged inputs
        run: python3 scripts/parity_fuzz.py --variants 3

      - name: Live mode persists across restarts and never touches weights
        shell: bash
        run: |
          set -euo pipefail
          R=rust/target/release/zerolm
          before=$(sha256sum weights.zlm)
          life="$(mktemp -d)/life.zlm"
          printf 'remember the code word is plum\nteach ahoy matey as greeting\n' | $R live --life "$life" >/dev/null
          out=$(printf 'what is the code word\nahoy matey\n' | $R live --jsonl --life "$life")
          echo "$out"
          echo "$out" | head -1 | grep -q 'the code word is plum'
          echo "$out" | tail -1 | grep -q '"intent":"greeting"'
          [ "$before" = "$(sha256sum weights.zlm)" ]

      - name: HTTP API - validate the OpenAPI document and run the official OpenAI SDK against the server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q openai openapi-spec-validator
          "$RUNNER_TEMP/venv/bin/openapi-spec-validator" rust/openapi.yaml
          dir="$(mktemp -d)"
          token="ci-token-0123456789abcdef"
          ZEROLM_TOKEN="$token" rust/target/release/zerolm serve --addr 127.0.0.1:0 --dir "$dir" > "$dir/out.log" &
          pid=$!
          trap 'kill $pid' EXIT
          for _ in $(seq 1 50); do grep -q listening "$dir/out.log" && break; sleep 0.2; done
          addr="$(grep -o '127.0.0.1:[0-9]*' "$dir/out.log")"
          "$RUNNER_TEMP/venv/bin/python" scripts/check_openai_sdk.py "$addr" "$token"

      - name: Intent router - build the example, check it is up to date, evaluate it, call /v1/classify
        shell: bash
        run: |
          set -euo pipefail
          python3 build_model.py --spec examples/router/spec.json --out examples/router/weights.zlm --check
          python3 scripts/evaluate_router.py --model examples/router/weights.zlm --data examples/router/labelled.tsv --min-accuracy 0.9
          python3 scripts/evaluate_router.py --model weights.zlm --data tests/regression.tsv --min-accuracy 1.0
          # Held-out floors (measured 85% dev, 83% frozen test): fail on a real drop, not on noise.
          python3 scripts/evaluate_router.py --model weights.zlm --data tests/heldout.tsv --min-accuracy 0.80
          python3 scripts/evaluate_router.py --model weights.zlm --data tests/heldout_test.tsv --min-accuracy 0.78
          python3 scripts/robustness.py --binary rust/target/release/zerolm --min-survival 0.80
          dir="$(mktemp -d)"
          rust/target/release/zerolm serve --model examples/router/weights.zlm --addr 127.0.0.1:0 --dir "$dir" > "$dir/out.log" &
          pid=$!
          trap 'kill $pid' EXIT
          for _ in $(seq 1 50); do grep -q listening "$dir/out.log" && break; sleep 0.2; done
          addr="$(grep -o '127.0.0.1:[0-9]*' "$dir/out.log")"
          out=$(curl -sf -d '{"texts":["I was charged twice","tell me a joke"]}' "http://$addr/v1/classify")
          echo "$out"
          echo "$out" | grep -q '"intent":"billing"'
          echo "$out" | grep -q '"abstained":true'

  docker:
    name: Docker image (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build the image and run the container smoke test
        run: scripts/docker_smoke.sh

  next:
    name: ZeroLM Next - compositional network (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_SEED: "20260701"
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Record environment, toolchain, seed and commit
        run: |
          set -euo pipefail
          mkdir -p reports/next
          {
            echo "commit: ${GITHUB_SHA}"
            echo "benchmark seed: ${NEXT_SEED}"
            echo "runner: ${RUNNER_OS} $(uname -m)"
            rustc --version; cargo --version; cc --version | head -n 1; python3 --version
          } | tee reports/next/environment.txt

      - name: Validate the model specification and reproduce the generated weights
        run: |
          set -euo pipefail
          python3 -m json.tool model/next/spec.json > /dev/null
          for p in model/next/patches/*.json experiments/next-patches/*.json; do python3 -m json.tool "$p" > /dev/null; done
          python3 research/build_next.py --check
          python3 research/build_next.py --upto 0 --out "$RUNNER_TEMP/weights.r0.zln"
          python3 research/benchmark/adversarial.py
          git diff --exit-code tests/next/adversarial.jsonl
          sha256sum model/next/weights.zln | tee reports/next/weights.sha256

      - name: Build the legacy C reference and the Rust runtime
        run: |
          set -euo pipefail
          make all
          cargo build --release --manifest-path rust/Cargo.toml

      - name: Unit, shortcut-detection and inference tests (cargo)
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Lint (clippy, warnings are errors)
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - name: Legacy v0.2 regression suite must stay at 100 percent
        run: |
          set -euo pipefail
          python3 scripts/evaluate.py | tee reports/next/legacy-regression.log
          diff <(./zerolm --self-test) <(rust/target/release/zerolm --self-test)

      - name: Weight-patch workflow - every patch validates and records its observed results
        run: |
          set -euo pipefail
          for p in experiments/next-patches/*.json; do
            python3 research/tools/wsp.py validate "$p"
            python3 - "$p" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1]))
          assert p["observed"] and p["regression_result"], f"patch {p['id']} has no recorded results"
          PY
          done
          python3 research/tools/wsp.py inspect > reports/next/architecture.txt

      - name: Development, defect and adversarial suites (all must pass in full)
        run: |
          set -euo pipefail
          E="python3 research/benchmark/evaluate.py --system next"
          $E --cases tests/next/dev.jsonl --min exact_match=1.0 --min correct_rejection=0.97 --out reports/next/dev.json
          $E --cases tests/next/adversarial.jsonl --min exact_match=1.0 --min correct_rejection=1.0 --out reports/next/adversarial.json
          $E --cases tests/next/primitives.jsonl --min exact_match=0.99 --out reports/next/primitives.json
          for f in tests/next/defects-00*.jsonl; do
            $E --cases "$f" --min "$(python3 -c "import json,sys; c=[json.loads(l) for l in open('$f')]; print('exact_match=1.0' if c[0]['expect']=='accept' else 'correct_rejection=1.0')")" --out "reports/next/$(basename "$f" .jsonl).json"
          done

      - name: Regenerate the compositional holdout from its seeds and verify the manifest
        run: |
          set -euo pipefail
          python3 research/benchmark/manifest.py check
          python3 research/benchmark/generate.py --profile final --seed "$NEXT_SEED" --dev tests/next/dev.jsonl --out tests/next/final.jsonl

      - name: Compositional generalization, baselines, ablations and scaling (fails on a missed floor or a dead ablation)
        run: python3 research/benchmark/run_suite.py --cases tests/next/final.jsonl --seed "$NEXT_SEED" --out reports/next

      - name: Forward-pass execution traces
        run: |
          set -euo pipefail
          mkdir -p reports/next/traces
          i=0
          while IFS= read -r line; do
            i=$((i+1))
            rust/target/release/zerolm next trace "$line" > "reports/next/traces/trace-$i.json"
          done < research/benchmark/trace_examples.txt
          rust/target/release/zerolm next info | tee reports/next/info.txt

      - name: Upload reports and traces
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: zerolm-next-reports
          path: |
            reports/next/
            model/next/weights.zln
          if-no-files-found: error
          retention-days: 30
