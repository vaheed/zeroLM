name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine-unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo build --workspace --release
      - run: cargo test --workspace
  architecture-bakeoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - name: Bake-off (fails on instability, ablation failure, latency, or selection drift)
        run: cargo run --release -p zerolm-eval --bin zerolm-bakeoff -- --check model/specs/architecture.json --out reports/bakeoff
      - name: Job summary
        if: always()
        run: |
          if [ -s reports/bakeoff/summary.md ]; then cat reports/bakeoff/summary.md >> "$GITHUB_STEP_SUMMARY"; else echo "Report: **not produced** (gate incomplete)" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zerolm-bakeoff-${{ github.sha }}
          path: reports/bakeoff/
          if-no-files-found: warn
          retention-days: 30
  policy-and-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup toolchain install stable --profile minimal
      - run: rustup toolchain install 1.75.0 --profile minimal --component clippy
      - run: cargo test --workspace
      # Lint against the declared rust-version (1.75), the same toolchain used
      # locally, so lint results are reproducible and fixes stay MSRV-compatible.
      - run: cargo +1.75.0 clippy --workspace --all-targets -- -D warnings
      - name: Compiled circuits match their pinned hashes
        run: |
          mkdir -p reports/audit
          cargo run -q -p zerolm-wsp -- check | tee reports/audit/circuits.txt
      - name: Policy audit
        run: |
          mkdir -p reports/audit
          cargo run -q -p zerolm-policy --bin zerolm-audit -- --json | tee reports/audit/summary.json
      - name: Baseline provenance (clean tree)
        run: |
          cargo run -q -p zerolm-policy --bin zerolm-baseline -- generate
          cargo run -q -p zerolm-policy --bin zerolm-baseline -- check
      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Policy and provenance: ${{ job.status }}"
            if [ -s reports/audit/summary.json ]; then
              echo "- policy audit: $(jq -r 'if .passed then "passed (" + (.checks_run | join(", ")) + ")" else "FAILED: " + ([.violations[].detail] | join("; ")) end' reports/audit/summary.json)"
            else
              echo "- policy audit: **not produced**"
            fi
            if [ -s reports/audit/circuits.txt ]; then echo "- compiled circuits: $(grep -c ' pinned$' reports/audit/circuits.txt) of $(wc -l < reports/audit/circuits.txt) match their pinned hashes"; fi
            if [ -s reports/baseline/next.json ]; then echo "- baseline provenance: recorded for commit \`${GITHUB_SHA::7}\`"; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zerolm-baseline-${{ github.sha }}
          path: |
            reports/audit/
            reports/baseline/
          if-no-files-found: warn
          retention-days: 30
  bootstrap-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - name: Run the teaching protocol on a clean model
        run: |
          mkdir -p reports/bootstrap
          cargo run -q -p zerolm-runtime -- info | tee reports/bootstrap/info.txt
          printf 'teach sky => blue\nask sky\nconfirm sky\nforget sky\nask sky\n' | cargo run -q -p zerolm-runtime -- run --trace reports/bootstrap/trace.jsonl | tee reports/bootstrap/output.txt
      - name: Job summary
        if: always()
        run: |
          if [ -s reports/bootstrap/trace.jsonl ]; then { echo "## Bootstrap: ${{ job.status }}"; echo '```'; cat reports/bootstrap/info.txt reports/bootstrap/output.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; else echo "## Bootstrap: report **not produced**" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zerolm-bootstrap-${{ github.sha }}
          path: reports/bootstrap/
          if-no-files-found: warn
          retention-days: 30
  online-learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - name: Online-learning invariants (hash change, exact event log, no future leak, disabled = no update)
        run: cargo test -p zerolm-learning -p zerolm-eval --test online
      - name: Online-learning acquisition gate (3 seeds, frozen floor; fails if the primary local rule does not clear it)
        run: cargo run --release -p zerolm-eval --bin zerolm-online-lm -- --out reports/online-learning
      - name: Job summary
        if: always()
        run: |
          {
            if [ -s reports/online-learning/brief.md ]; then cat reports/online-learning/brief.md; else echo "## online-learning: report **not produced**"; fi
            echo; echo "Full report: artifact \`zerolm-online-learning-${{ github.sha }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zerolm-online-learning-${{ github.sha }}
          path: reports/online-learning/
          if-no-files-found: warn
          retention-days: 30
  weight-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - name: Memory invariants (restart, core byte identity, supersession, deletion, compaction, capacity, corrupt/interrupted checkpoints)
        run: cargo test -p zerolm-memory -p zerolm-runtime && cargo test -p zerolm-eval --test memory
      - name: Memory gate (3 seeds x 1,200 facts, restart, frozen gates; fails on any failed check)
        run: cargo run --release -p zerolm-eval --bin zerolm-memory -- --out reports/memory
      - name: Cross-process recall through the CLI
        run: |
          mkdir -p reports/memory/cli
          ckpt="$RUNNER_TEMP/zerolm-memory"
          printf 'teach sky color => blue\nconfirm sky color\nteach mill owner => dara\n' | cargo run -q --release -p zerolm-runtime -- memory --dir "$ckpt" --trace reports/memory/cli/trace-1.jsonl | tee reports/memory/cli/output-1.txt
          printf 'ask what is the color of the sky?\nask mill owner\nask sky size\n' | cargo run -q --release -p zerolm-runtime -- memory --dir "$ckpt" --trace reports/memory/cli/trace-2.jsonl | tee reports/memory/cli/output-2.txt
          grep -qx 'what is the color of the sky? => blue (confirmed)' reports/memory/cli/output-2.txt
          grep -qx 'mill owner => dara (unconfirmed)' reports/memory/cli/output-2.txt
          grep -qx 'unknown sky size' reports/memory/cli/output-2.txt
          ls "$ckpt" | tee reports/memory/cli/checkpoint-files.txt
      - name: Job summary
        if: always()
        run: |
          {
            if [ -s reports/memory/brief.md ]; then cat reports/memory/brief.md; else echo "## memory: report **not produced**"; fi
            if [ -s reports/memory/cli/output-2.txt ]; then echo; echo "Command-line check (a new process reading the saved checkpoint):"; echo '```'; cat reports/memory/cli/output-2.txt; echo '```'; fi
            echo; echo "Full report: artifact \`zerolm-memory-${{ github.sha }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zerolm-memory-${{ github.sha }}
          path: reports/memory/
          if-no-files-found: warn
          retention-days: 30
  compositional-reasoning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - name: Reasoner invariants (operators vs oracle, operator and pathway ablations, provenance, persistence, parser)
        run: cargo test -p zerolm-engine -p zerolm-reasoner && cargo test -p zerolm-eval --test reasoning
      - name: Reasoning gate (3 seeds + 1 hidden seed, frozen gates; fails on any gate)
        env:
          # Optional repository secret; when unset the hidden seed is derived from the commit.
          ZEROLM_HIDDEN_SEED: ${{ secrets.ZEROLM_HIDDEN_SEED }}
        run: cargo run --release -p zerolm-eval --bin zerolm-reasoning -- --out reports/reasoning
      - name: Cross-process reasoning through the CLI
        run: |
          mkdir -p reports/reasoning/cli
          mem="$RUNNER_TEMP/zerolm-reason"
          printf 'every dog is a mammal\nall mammals are animals\nrex is a dog\nit is in kennel\nkennel is in yard\n' | cargo run -q --release -p zerolm-runtime -- reason --dir "$mem" | tee reports/reasoning/cli/output-1.txt
          printf 'is rex an animal?\nis rex in yard?\nis rex a fish?\n' | cargo run -q --release -p zerolm-runtime -- reason --dir "$mem" --trace reports/reasoning/cli/trace-2.jsonl | tee reports/reasoning/cli/output-2.txt
          grep -q '^yes (derived: class_inclusion' reports/reasoning/cli/output-2.txt
          grep -q '^yes (derived: transitivity; 2 premises; confidence 0.90)' reports/reasoning/cli/output-2.txt
          grep -qx 'unknown' reports/reasoning/cli/output-2.txt
      - name: Job summary
        if: always()
        run: |
          {
            if [ -s reports/reasoning/brief.md ]; then cat reports/reasoning/brief.md; else echo "## reasoning: report **not produced**"; fi
            if [ -s reports/reasoning/cli/output-2.txt ]; then echo; echo "Command-line check (a new process reading the saved checkpoint):"; echo '```'; cat reports/reasoning/cli/output-2.txt; echo '```'; fi
            echo; echo "Full report: artifact \`zerolm-reasoning-${{ github.sha }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zerolm-reasoning-${{ github.sha }}
          path: reports/reasoning/
          if-no-files-found: warn
          retention-days: 30
  # Last stage: runs only after every test and gate job above has passed.
  # Pull requests build and smoke-test the image; pushes to main and v* tags
  # also publish it to ghcr.io/<owner>/zerolm (latest, sha-<short>, version).
  docker-image:
    needs: [engine-unit, architecture-bakeoff, policy-and-provenance, bootstrap-cli, online-learning, weight-memory, compositional-reasoning]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name (registry names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zerolm" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: zerolm:ci
          build-args: ZEROLM_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          mkdir -p reports/docker
          {
            docker run --rm zerolm:ci zerolm info
            docker run --rm -i zerolm:ci zerolm reason --verbose < examples/reasoning-more.txt
            docker run --rm zerolm:ci zerolm-audit --json
          } 2>&1 | tee reports/docker/smoke.txt
          grep -q "no (derived: attribute_inheritance, negation" reports/docker/smoke.txt
          grep -q '"violations": \[\]' reports/docker/smoke.txt
      - name: Image tests
        run: docker run --rm zerolm:ci cargo test --workspace --locked
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Docker image"
            echo "- image: \`${IMAGE}\`"
            echo "- tags: \`$(echo '${{ steps.meta.outputs.tags }}' | tr '\n' ' ')\`"
            echo "- published: ${{ github.event_name != 'pull_request' }}"
            if [ -s reports/docker/smoke.txt ]; then echo '```'; head -60 reports/docker/smoke.txt; echo '```'; else echo "Smoke test: **not produced**"; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: ZEROLM_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
